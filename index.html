<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlgoSim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { const t = localStorage.getItem('algosim-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7 7.2 10.8 16M17 7.2 13.2 16M7.2 6h9.6"/></svg>
        </span>
        <span class="brand-name">AlgoSim</span>
      </a>
      <nav class="nav" id="algo-nav" aria-label="Algorithms"></nav>
      <div class="sidebar-foot">
        <button class="icon-btn" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <span class="kbd-hint"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> step</span>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>

  <script src="js/core/registry.js"></script>
  <script src="js/core/player.js"></script>
  <script src="js/core/graph.js"></script>
  <script src="js/core/search.js"></script>
  <script src="js/core/search-page.js"></script>
  <script src="js/core/grid.js"></script>
  <script src="js/core/local.js"></script>
  <script src="js/algorithms/search-algos.js"></script>
  <script src="js/algorithms/puzzle.js"></script>
  <script src="js/algorithms/local-search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
